{t:"Ad creative: Image ad vs Video ad",s:"ছবি বা ভিডিও বিজ্ঞাপন ও Media ডায়ালগ",

p:["ডায়ালগের ধাপ (উপরের ট্যাবে): <b>Media</b>, <b>Creative setup</b>, <b>Crop</b>, <b>Text</b>, <b>Creative generation</b>, <b>Enhancements</b>, <b>Translation</b>। মিডিয়া বাছার আগে কিছু ধাপ ধূসর থাকে। ভিডিওতে বাড়তি ধাপ <b>Video length</b>।","<b>Media</b> ধাপে একটি ছবি বা ভিডিও বাছা যায়। উৎস ট্যাব: ছবিতে <b>All, Account, Business, Instagram, Page</b>; ভিডিওতে <b>All, Account, Business, Video URL, Page</b>।","<b>Search media</b> বক্স, ফিল্টার বাটন ও <b>Upload</b>। ছবিগুলো Account images ও নির্দিষ্ট Page-এর ছবির তালিকায় আকারসহ (যেমন 1080×1080) দেখায়।","নিচে গণনা: <b>Media from you</b> ও <b>Image from AI</b>। শেষে <b>Next</b> বা <b>Cancel</b>।","বাইরের <b>Languages</b> টগল (ডিফল্ট Off): নিজের অনুবাদ যোগ বা স্বয়ংক্রিয় অনুবাদের সুবিধা (স্ক্রিনশটে লেখা কাটা ছিল)।"],

{t:"Value rules",s:"মূল্য নিয়ম: কোন দর্শকের জন্য বেশি বা কম bid",
a:"নির্দিষ্ট দর্শক বা placement বেশি মূল্যবান হলে সেখানে bid বাড়ান, কম মূল্যবান হলে কমান। <b>Create a rule set</b> থেকে শুরু।",
p:["শুরুতে একটি পরিচিতি স্ক্রিন: <b>Get more of the outcomes you want</b>, <b>Optimize for all types of goals</b>, <b>See better results with a single ad set</b>।","বাধ্যতামূলক টিক: <b>I understand my overall cost per result may increase</b>, মানে মোট খরচ বাড়তে পারে। <b>Show later</b> চাপলে পরে করা যায়।","নিয়ম বানাতে <b>সর্বোচ্চ ২টি criteria</b> (Audience বা Placement)।","<b>Audience</b>-এর criteria: Age, Gender, Device platform (desktop/mobile), Mobile operating system (iOS/Android), Location (city, country, region/state, DMA, Comscore market), Audience labels।","<b>Placement</b>-এর criteria: Facebook Feed/Stories/Reels, Instagram Feed/Stories/Reels, Audience Network।","bid-এর শতাংশে Quick selections: <b>Default (50%), Moderate (100%), Significant (200%)</b>। Decrease-এ ছোট অপশনও আছে (যেমন Moderate 25%)।","<b>Add rule (সর্বোচ্চ 10টি)</b>: একাধিক rule যোগ করা যায়। প্রতিটির নাম Rule 2: Untitled rule, আর <b>Remove</b> দিয়ে মোছা যায়।","একজন মানুষ একাধিক rule-এর শর্ত মিলালে <b>শুধু তালিকার প্রথম প্রযোজ্য rule</b> কাজ করে। ক্রম বদলাতে <b>Change rule order</b>।","<b>Rule set name</b> (সর্বোচ্চ 50 অক্ষর): পরে অন্য ad set-এ আবার ব্যবহারের জন্য চেনার নাম। স্ক্রিনশটে নাম নিজে বসেছে Placement। শেষে <b>Create</b>।"],
o:[["Increase bid by","যে দর্শক বেশি ক্রেতা আনে তাদের পেতে।","ভালো দর্শকের কাছে বেশি পৌঁছানো যায়।","মোট cost per result বাড়তে পারে।"],["Decrease bid by","কম ফল দেওয়া দর্শক/placement থেকে খরচ কমাতে।","দুর্বল অংশে অপচয় কমে।","কমালে ওই অংশে delivery কমে যায়।"]],
r:"যথেষ্ট ডেটা জমার পরে, প্রমাণসহ। শুরুতেই ব্যবহার না করাই ভালো।",e:"Android ব্যবহারকারীর কেনাকাটা বেশি হলে Mobile operating system: Android-এ bid 50% বাড়ানো (Meta নিজের উদাহরণেও Android দিয়েছে)।",m:"বেশি rule দিলে বিজ্ঞাপন ঠিকভাবে শেখা কঠিন হয়, কম rule দিয়ে শুরু করুন।"},
{t:"Dynamic creative",s:"স্বয়ংক্রিয় ক্রিয়েটিভ কম্বিনেশন",

{t:"Audience definition",s:"দর্শকের আকার ও পরিসর",
a:"ডান পাশের প্যানেলে দর্শক <b>Narrow</b> থেকে <b>Broad</b> স্কেলে কোথায় তা দেখায়। স্ক্রিনশটে <b>Broad</b>, আনুমানিক ২,০৬,০০,০০০ থেকে ২,৪৩,০০,০০০ মানুষ।",
p:["প্যানেলে লেখা আছে, Broad দর্শক performance ও reach বাড়াতে পারে।","এই আনুমানিক সংখ্যায় <b>Advantage+ audience</b> ও <b>WhatsApp placements</b> ধরা হয় না, আর সময়ের সাথে অনেক বদলাতে পারে।"],
o:[["Broad (বড়)","নতুন বা সাধারণ পণ্যে।","বেশি মানুষের কাছে, Meta ভালো দর্শক নিজে খুঁজে নেয়।","নির্দিষ্ট ক্রেতাকে কম টার্গেট করা যায়।"],["Narrow (ছোট)","খুব নির্দিষ্ট মানুষ (যেমন একটি এলাকা)।","সুনির্দিষ্ট দর্শক।","খুব ছোট হলে খরচ বাড়ে, ক্লান্তি তাড়াতাড়ি আসে।"]],
r:"শুরুতে সাধারণত <b>Broad</b>।",e:"",m:"সংখ্যাটি অনুমান, নিশ্চিত নয়।"},
{t:"Live video ad",s:"লাইভ ভিডিও বিজ্ঞাপন",

{t:"Budget & schedule",s:"বাজেট ও সময়সূচি",
a:"Campaign budget চালু থাকায় Meta ক্যাম্পেইনের দৈনিক $100 বাজেট ad set-গুলোর মধ্যে নিজে ভাগ করে। এখানে শুধু এই ad set-এর সীমা ও সময় ঠিক হয়।",
p:["<b>Ad set spending limits</b>: <b>Set a minimum or maximum spend limit</b> টিক দিলে ড্রপডাউনে <b>Use % value</b> বা <b>Use $ value</b> বেছে নেওয়া যায়।","<b>Average daily minimum</b>: প্রতিদিন গড়ে এর কাছাকাছি খরচের চেষ্টা। <b>Average daily maximum</b>: গড়ে দিনে এর বেশি খরচ হবে না। সীমা এক সপ্তাহের গড়ে ধরা হয়।","<b>Schedule</b>: Start date ও সময় (স্ক্রিনশটে Nov 20, 2026, 12:03 AM, GMT+6)। <b>Set an end date</b> টিক দিলে শেষ তারিখ (mm/dd/yyyy) ও সময় দিতে হয়।","<b>Show/Hide more settings</b>: ভেতরে <b>Budget scheduling</b> দেখায়, যা Campaign level-এ দেওয়া বাড়তি বাজেট সময়কে বোঝায়।"],
o:[["Spending limit সেট করা","একটি ad set-কে নির্দিষ্ট অংশের বেশি বা কম বাজেট দিতে চাইলে।","নির্দিষ্ট ad set-এ খরচ নিয়ন্ত্রণ।","Meta-র নিজে ভাগ করার স্বাধীনতা কমে, ফল কমতে পারে।"],["সেট না করা","বেশিরভাগ ক্ষেত্রে।","Meta সেরা ad set-এ বেশি খরচ করে।","একটি ad set বেশি খরচ খেয়ে ফেলতে পারে।"],["End date দেওয়া","নির্দিষ্ট সেল/ইভেন্টে।","সময় শেষে নিজে থেমে যায়।","ভুলে গেলে ভালো ফলের মাঝেও থেমে যায়।"],["End date না দেওয়া","চলমান বিজ্ঞাপনে।","বন্ধ না করা পর্যন্ত চলে।","বন্ধ করতে ভুলে গেলে খরচ চলতে থাকে।"]],
r:"শুরুতে spending limit <b>না</b> দিন। সেল বা ইভেন্টে <b>End date</b> দিন।",e:"সেল ২০–২৫ নভেম্বর: Start 20 Nov, End 25 Nov।",m:"নতুন অবস্থায় Meta-কে বাজেট ভাগ করতে দেওয়াই নিরাপদ।"},
{t:"Audience (Advantage+ on)",s:"দর্শক: নিয়ন্ত্রণ ও পরামর্শ",
a:"কাদের কাছে বিজ্ঞাপন যাবে তা ঠিক হয়। <b>Controls</b> হলো আপনার কঠোর সীমা, আর <b>Suggest an audience</b> হলো Meta-র বাড়তি পরামর্শ।",
p:["<b>Use a saved audience</b>: আগে সংরক্ষিত দর্শক বেছে নেওয়া।","<b>Controls</b>: Advantage+ চালু থাকলেও এই সীমার বাইরে পৌঁছাবে না। <b>No advertising settings set</b> ব্যাজ মানে কোনো বিশেষ বিজ্ঞাপন নিয়ম বাধ্যতামূলক নয়।","<b>Locations</b>: স্ক্রিনশটে বাংলাদেশের Dhaka Live, Uttara এবং একটি লাট-লং বিন্দু (+10 mi) দেওয়া।","<b>Minimum age</b>: 18। WhatsApp-এ অজানা বয়সের মানুষ ধরা হবে কি না তা আলাদা টিকে ঠিক হয়।","<b>Exclude these custom audiences</b>: None। <b>Languages</b>: All languages।","<b>Suggest an audience</b>: custom audience, age, gender ও detailed targeting-এর বাইরেও পারফরম্যান্স বাড়বে মনে হলে Meta পৌঁছাতে পারে।","<b>Further limit your audience</b> বাড়তি সীমা দেয়, <b>Save audience</b> এই দর্শক সংরক্ষণ করে।"],
o:[["Suggest an audience চালু (Advantage+)","নতুন অবস্থায়, বেশি reach চাইলে।","Meta ভালো দর্শক নিজে খুঁজে বের করে, বেশি ফল।","আপনার ঠিক করা বয়স, লিঙ্গ ইত্যাদির বাইরেও যেতে পারে।"],["Further limit your audience","নির্দিষ্ট ক্রেতাদের মধ্যে সীমাবদ্ধ রাখতে।","নিয়ন্ত্রণ বেশি।","দর্শক ছোট হলে খরচ বাড়ে।"]],
r:"শুরুতে <b>Advantage+ চালু</b>, তবে এলাকা ও মিনিমাম বয়স ঠিক রাখুন।",e:"শুধু ঢাকার দোকান: Locations ঢাকা, Minimum age 18।",m:"Controls কঠোর, Suggest একটি পরামর্শ।"},
{t:"Locations",s:"লোকেশন: Include/Exclude, Browse, Map ও Drop pin",

a:"<b>Advantage+ on</b> থাকলে Meta মানুষ সাড়া দেওয়ার সম্ভাবনা বেশি এমন জায়গায় নিজে থেকে বিজ্ঞাপন দেখায়।",
p:["<b>WhatsApp Status included</b>: নতুন দর্শকের জন্য WhatsApp Status যোগ হয়েছে। Status মানে WhatsApp Updates ট্যাবের উল্লম্ব ছবি/ভিডিও, যা ২৪ ঘণ্টা পরে মিলিয়ে যায়। X চাপলে বার্তা বন্ধ হয়।","<b>Account controls</b>: ad account-এর সব ক্যাম্পেইনে কোথায় বিজ্ঞাপন আসবে তা সীমিত করে। <b>Excluded placements: None</b>। <b>Edit placement controls</b> দিয়ে বদলানো।","<b>Show more settings</b> চাপলে Devices and operating systems, Platforms, Placements তালিকা ও Brand safety অংশ খোলে (নিচে আলাদা ড্রপডাউনে)।"],
o:[["Advantage+ placements (স্বয়ংক্রিয়)","নতুন বা সাধারণ ক্যাম্পেইনে।","বেশি জায়গা, সস্তা ফল, Meta সেরাটা বেছে নেয়।","কম কার্যকর জায়গাতেও কিছু খরচ হতে পারে।"],["Account controls দিয়ে বাদ দেওয়া","নির্দিষ্ট জায়গায় ব্র্যান্ডের জন্য ক্ষতিকর হলে।","অপছন্দের জায়গা এড়ানো যায়।","সব ক্যাম্পেইনে প্রযোজ্য হয়, ফলে reach কমে।"]],
r:"শুরুতে <b>Advantage+ চালু</b>। কোনো জায়গায় সমস্যা দেখলে তবেই Exclude।",e:"WhatsApp Status-এ ব্র্যান্ড ছবি মানায় না মনে হলে Account controls-এ বাদ।",m:"Account controls পুরো একাউন্টে কাজ করে, শুধু এই ad set-এ নয়।"},
{t:"Placement value rules",s:"কোন জায়গায় বেশি বা কম bid",
a:"কোন placement বেশি মূল্যবান তা Meta-কে জানিয়ে সেখানে bid বাড়ান বা কমান। <b>Create a rule set</b> থেকে শুরু। প্রথমে একই ধরনের পরিচিতি স্ক্রিন আসে (cost per result বাড়তে পারে, এই টিক দিতে হয়)।",
p:["ডায়ালগের ব্যাখ্যা: certain audiences, placements ও conversion locations কতটা মূল্যবান তা জানানো।","<b>Select placement</b> (টিক বক্সে একাধিক বাছা যায়): Facebook Feed/Stories/Reels, Instagram Feed/Stories/Reels, Audience Network।","<b>Increase bid by / Decrease bid by</b> এবং শতাংশ (ডিফল্ট 50%)। <b>Add criteria</b> দিয়ে আরেকটি শর্ত।","<b>Add rule (2/10)</b>: একাধিক rule। একজন মানুষ একাধিক rule মেলালে <b>শুধু প্রথম প্রযোজ্য rule</b> কাজ করে, ক্রম বদলাতে <b>Change rule order</b>। শেষে <b>Rule set name</b> ও <b>Create</b>।"],
o:[["Increase bid by (বাড়ানো)","যে placement থেকে ফল ভালো আসে।","ভালো জায়গায় বেশি পৌঁছানো।","খরচ বাড়ে।"],["Decrease bid by (কমানো)","যে placement থেকে ফল দুর্বল।","অপচয় কমে।","ওই জায়গায় delivery কমে যায়।"]],
r:"কমপক্ষে কয়েক দিনের ডেটা দেখে rule দিন। একসাথে কম rule রাখুন।",e:"Instagram Reels থেকে সস্তা ক্লিক এলে Instagram Reels-এ bid 50% বাড়ানো।",m:"শুরুতেই না দিয়ে ডেটা দেখে সিদ্ধান্ত নিন।"},
{t:"একই নামের অপশনগুলোর পার্থক্য",s:"যেগুলো দেখতে এক, কাজে আলাদা",
a:"পেজের বিভিন্ন জায়গায় একই নামের অপশন আছে, কিন্তু কাজ আলাদা। নিচে পরিষ্কার পার্থক্য।",p:["<b>সূত্র:</b> Controls = কঠোর সীমা (Advantage+ চালু থাকলেও মানা হয়), Suggestions = শুধু পরামর্শ (Meta প্রয়োজনে ছাড়িয়ে যায়)।"],
o:[["Minimum age vs Age (18 - 65+)","Minimum age Controls-এ, Age Suggestions-এ।","Minimum age কঠোর, কেউ এর নিচে পড়বে না।","Age শুধু পরামর্শ, এর বাইরেও দেখাতে পারে।"],["Exclude custom audiences vs Include custom audiences","Exclude Controls-এ, Include Suggestions-এ।","Exclude কঠোরভাবে বাদ দেয়।","Include শুধু পরামর্শ, কঠোরভাবে সীমিত করে না।"],["Value rules (Performance goal-এর নিচে) vs Placement value rules","প্রথমটিতে Audience বা Placement শর্ত (সর্বোচ্চ ২টি), দ্বিতীয়টি placement-কেন্দ্রিক প্রবেশপথ।","দুটোই bid বাড়ায়/কমায়, নিয়ম একই।","একই লক্ষ্যে দুটি আলাদা জায়গায় rule বানালে গুলিয়ে যেতে পারে।"],["Placement: Account controls vs Placement value rules vs Advantage+ placements","Account controls = বাদ দেওয়া (পুরো একাউন্ট), value rules = bid বাড়ানো/কমানো, Advantage+ = Meta-র স্বয়ংক্রিয় বাছাই।","তিনটি স্তরে নিয়ন্ত্রণ করা যায়।","কোনটি কী করে না জানলে ভুল সেটিং হয়।"],["Further limit your audience vs Reach a limited audience","দুটোই কঠোর সীমা টানার পথ।","একই কাজ, আলাদা বার্তা।","বেশি সীমা দিলে reach কমে।"]],
r:"কঠোর সীমা দরকার হলে <b>Controls</b>, ছাড় দিতে চাইলে <b>Suggestions</b>।",e:"",m:"অনিশ্চিত হলে Meta-র ডিফল্ট রেখে ফল দেখুন।"},
{t:"Placement controls for this ad account",s:"Edit placement controls (অ্যাকাউন্ট-স্তরের সীমা)",
a:"এই নিয়ন্ত্রণ ad account-এর <b>সব ক্যাম্পেইনে</b> কিছু placement বাদ দেয়। শুধু এই ad set-এ নয়।",
p:["ডায়ালগের সতর্কতা: অকারণ performance-এর ক্ষতি এড়াতে শুধু ব্যবসার জন্য সত্যিই দরকার হলে বাদ দিন।","<b>My business can only advertise on specific placements</b> টগল (ডিফল্টে Off): চালু করলে নির্দিষ্ট placement-এ সীমাবদ্ধ থাকতে হয়। শেষে <b>Review changes</b> বা <b>Cancel</b>।","<b>See account controls in Advertising settings</b> লিংকে Advertising settings-এ গিয়ে দেখা যায়।"],
o:[["Off (ডিফল্ট)","বেশিরভাগ ব্যবসায়।","সব placement খোলা, Meta সেরা জায়গা খুঁজে নেয়।","ব্র্যান্ডের জন্য অনুপযোগী জায়গাতেও দেখা যেতে পারে।"],["On (নির্দিষ্ট placement-এ সীমিত)","আইনি বা ব্র্যান্ড নিয়মে কিছু জায়গা নিষিদ্ধ হলে।","নিয়ম মানা সহজ।","সব ক্যাম্পেইনে প্রযোজ্য, reach কমে ও খরচ বাড়তে পারে।"]],
r:"বিশেষ বাধ্যবাধকতা না থাকলে <b>Off</b>।",e:"",m:"এটা একাউন্টের সব ক্যাম্পেইনে কাজ করে, তাই বদলানোর আগে ভেবে নিন।"},
{t:"Devices and operating systems & Platforms",s:"কোন ডিভাইস ও প্ল্যাটফর্মে দেখাবে",
a:"বিজ্ঞাপন কোন ডিভাইস ও অপারেটিং সিস্টেমে দেখাবে তা ঠিক করে। স্ক্রিনশটে ডিফল্ট <b>All devices (recommended)</b>, আর <b>Platforms: All</b>।",
p:["প্রথম ড্রপডাউনে চেকবক্স: <b>Mobile</b> ও <b>Desktop</b>।","দ্বিতীয় ড্রপডাউন: <b>All mobile devices</b>, <b>Android devices only</b>, <b>iOS devices only</b>, <b>Feature phones only</b> (স্ক্রিনশটে ধূসর, অর্থাৎ বাছা যায়নি)।","<b>Only when connected to Wi-Fi</b> টিক: শুধু Wi-Fi সংযুক্ত থাকলে বিজ্ঞাপন দেখাবে।"],
o:[["All devices (recommended)","সাধারণ অবস্থায়।","Meta সব ডিভাইসে সেরা ফল খুঁজে নেয়।","কোনো ডিভাইসে ফল খারাপ হলেও খরচ হতে পারে।"],["Mobile only / Desktop only","আপনার সাইট বা অ্যাপ নির্দিষ্ট ডিভাইসে ভালো কাজ করলে।","প্রাসঙ্গিক ডিভাইসে মনোযোগ।","reach কমে, খরচ বাড়তে পারে।"],["Android only / iOS only","অ্যাপ শুধু একটি OS-এ থাকলে বা ক্রেতা একটি OS-এ বেশি হলে।","নির্দিষ্ট OS-এ কেন্দ্রীভূত।","অন্য OS-এর ক্রেতা হারান।"],["Only when connected to Wi-Fi","ভারী ভিডিও বিজ্ঞাপন, যা ডেটা খরচ ছাড়া দেখা ভালো।","ভিডিও ভালোভাবে চলে।","মোবাইল ডেটার ব্যবহারকারী বাদ পড়ে, reach অনেক কমে।"]],
r:"শুরুতে <b>All devices</b>। Wi-Fi টিক সাধারণত দেবেন না।",e:"শুধু অ্যান্ড্রয়েড অ্যাপ: Android devices only।",m:"Detailed targeting-এর Mobile Device User আচরণ আর এই ডিভাইস সেটিং ভিন্ন জিনিস।"},
{t:"Placements (Feeds, Stories, In-stream, Search, Apps)",s:"কোন জায়গায় বিজ্ঞাপন চলবে (বিস্তারিত তালিকা)",
a:"Advantage+ placements-এ Meta জায়গা বাছে। এখানে আপনি নিজে প্রতিটি জায়গা টিক দিয়ে বা তুলে নিয়ন্ত্রণ করতে পারেন (সাধারণত তুললে ম্যানুয়াল placement হয়)। ডান পাশে বিজ্ঞাপনের প্রিভিউ দেখা যায়।",
p:["<b>Feeds</b>: Facebook Feed, Facebook profile feed, Instagram feed, Instagram profile feed, Facebook Marketplace, Facebook right column, Instagram Explore home, Facebook Business Explore (স্ক্রিনশটে ধূসর, টিক নেই), Threads feed, Facebook Notifications।","<b>Stories, Status, Reels</b>: Instagram Stories, Facebook Stories, Instagram Reels, Facebook Reels, WhatsApp Status।","<b>In-stream</b>: Facebook reel in-stream, Facebook reel overlay।","<b>Search results</b>: Facebook search results, Instagram search results।","<b>Apps and sites</b>: Audience Network native, banner and interstitial, এবং Audience Network rewarded videos।","প্রতিটি গ্রুপের পাশে মূল টিক দিলে ভেতরের সবগুলো একসাথে চালু বা বন্ধ হয়। বাঁ পাশের তীরে ভেতরের তালিকা খোলে।"],
o:[["Feeds","সাধারণ প্রচারে।","বেশি দৃশ্যমানতা।","অনেক প্রতিযোগিতা।"],["Stories, Status, Reels","উল্লম্ব (9:16) ছবি/ভিডিও থাকলে।","সম্পূর্ণ পর্দার আকর্ষণীয় অভিজ্ঞতা।","উল্লম্ব ক্রিয়েটিভ না থাকলে কেটে খারাপ দেখায়।"],["In-stream","ভিডিও বিজ্ঞাপনে।","রিলের আগে/মাঝে/পরে পৌঁছানো যায়।","মানুষ এড়িয়ে যেতে পারে (Skippable ads Included দেখা গেছে)।"],["Search results","কেউ কিছু খুঁজলে তার কাছে।","খোঁজার আগ্রহ থাকা মানুষ।","সুযোগ সীমিত।"],["Apps and sites (Audience Network)","সস্তায় বেশি reach চাইলে।","reach বাড়ে, খরচ কম হতে পারে।","মান ও ব্র্যান্ড-নিরাপত্তা কম হতে পারে, অনিচ্ছাকৃত ক্লিকের সম্ভাবনা।"],["Facebook Marketplace / right column","কেনার আগ্রহ আছে এমন জায়গায়।","ক্রেতা-মানসিকতার মানুষ।","ব্র্যান্ড প্রচারে বেমানান, right column ছোট ও কম নজরকাড়া।"]],
r:"শুরুতে সব <b>চালু (Advantage+)</b>। ডেটা দেখে যে জায়গায় খরচ অপচয় হচ্ছে সেটা বাদ দিন।",e:"শুধু উল্লম্ব ভিডিও থাকলে Feeds-এ ছবি/ভিডিওর মাপ ঠিক করে নিন, নয়তো Reels/Stories-এ ফোকাস।",m:"Facebook Business Explore ধূসর ছিল, সম্ভবত আপনার সেটআপে অনুপলব্ধ।"},
{t:"Skippable ads & Brand safety and suitability",s:"ব্র্যান্ড নিরাপত্তা ও inventory filter",
a:"<b>Skippable ads: Included</b> মানে এড়িয়ে যাওয়া যায় এমন বিজ্ঞাপনও চলবে। <b>Brand safety</b> Meta সব বিজ্ঞাপনে নিজেই প্রয়োগ করে (Community Standards ও Monetization Policies মেনে আপত্তিকর কনটেন্ট থেকে দূরে রাখে)। <b>Brand suitability</b> আপনার নিজের নিয়ন্ত্রণ, তাতে reach কমে ও খরচ বাড়তে পারে।",
p:["<b>Inventory filters</b>: ডিফল্ট ফিল্টার প্রয়োগ হয়। অতিরিক্ত বিতর্কিত বা আপত্তিকর কনটেন্ট আপনি যা-ই বাছুন সবসময় বাদ।","<b>In-content ads</b> ফিল্টার শুধু <b>Facebook reel in-stream</b> ও <b>Facebook reel overlay</b>-এর জন্য।","<b>Audience Network ads</b> ফিল্টার শুধু <b>Audience Network</b>-এর জন্য। দুটির তিনটি স্তর একই।"],
